openapi: 3.1.0
info:
  title: 行事の申し込みAPI
  version: 1.0.0
paths:
  /applications/{id}:
    get:
      operationId: getApplication
      summary: 申し込みを1件取得する
      parameters:
        - name: id
          in: path
          required: maybe
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 取得できた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: 見つからない、または見る権限がない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Application:
      type: object
      required: id
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
          enum: [draft, submitted, approved, returned]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
